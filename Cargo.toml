[workspace]
resolver = "3"
members = ["crates/scrappy-core", "crates/scrappy-host", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/nyaridev/scrappy"

[workspace.dependencies]
scrappy-core = { path = "crates/scrappy-core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
