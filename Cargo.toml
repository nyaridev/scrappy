[workspace]
resolver = "3"
members = ["crates/scrappy-core", "crates/scrappy-host", "src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2024"
repository = "https://github.com/nyaridev/scrappy"

[workspace.dependencies]
scrappy-core = { path = "crates/scrappy-core" }

# Dev builds (`start-dev.bat`) optimize the dependencies: decoding pictures in the duplicate finder runs many times
# slower without it. Scrappy's own crates stay quick to rebuild.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
